<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LA INDUSTRIA — Bebidas</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Bebas+Neue&family=Montserrat:wght@300;400;600;800&display=swap');

  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  :root { --gold: #D4A843; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Montserrat',sans-serif; }

  #stage { position:relative; width:100vw; height:100vh; overflow:hidden; }

  .slide { position:absolute; inset:0; opacity:0; pointer-events:none; }
  .slide.active { opacity:1; pointer-events:auto; }

  .bg {
    position:absolute; inset:0;
    background-size:cover;
    background-position:center center;
    background-repeat:no-repeat;
    transform:scale(1.07);
    filter:brightness(0.72) saturate(1.2);
  }
  @media (max-width:600px) {
    .bg {
      background-size:contain;
      background-position:center top;
      background-color:#000;
      filter:brightness(0.6) saturate(1.1);
    }
  }
  .slide.active .bg { animation:kenBurns 9s ease-out forwards; }
  @keyframes kenBurns { from{transform:scale(1.07)} to{transform:scale(1.00)} }

  .grad {
    position:absolute; inset:0;
    background:linear-gradient(to top,
      rgba(0,0,0,0.88) 0%,
      rgba(0,0,0,0.28) 45%,
      transparent 70%);
  }

  .particles { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .particle { position:absolute; border-radius:50%; animation:floatUp linear infinite; opacity:0; }
  @keyframes floatUp {
    0%   { transform:translateY(100vh) scale(0); opacity:0; }
    10%  { opacity:0.4; }
    90%  { opacity:0.15; }
    100% { transform:translateY(-10vh) scale(1.5); opacity:0; }
  }

  /* COPY */
  .copy { position:absolute; bottom:11%; left:7%; max-width:70%; }
  @media (max-width:600px) {
    .copy { bottom:8%; left:5%; max-width:88%; }
  }

  .slide-label {
    font-family:'Bebas Neue',cursive;
    font-size:clamp(10px,1.2vw,15px);
    letter-spacing:0.5em; color:var(--gold);
    opacity:0; transform:translateY(20px);
  }
  .slide.active .slide-label { animation:fadeUp 0.7s ease 0.4s forwards; }

  .drink-name {
    font-family:'Playfair Display',serif;
    font-size:clamp(36px,7vw,108px);
    font-weight:900; line-height:0.9;
    color:#fff; text-shadow:0 4px 50px rgba(0,0,0,0.7);
    opacity:0; transform:translateY(30px);
    margin:0.15em 0 0.2em;
  }
  .slide.active .drink-name { animation:fadeUp 0.9s cubic-bezier(0.22,1,0.36,1) 0.55s forwards; }
  .drink-name em { font-style:italic; color:var(--gold); }

  .drink-desc {
    font-size:clamp(11px,1.3vw,16px);
    font-weight:300; letter-spacing:0.18em;
    color:rgba(255,255,255,0.75);
    text-transform:uppercase; line-height:1.9;
    opacity:0; transform:translateY(20px);
  }
  .slide.active .drink-desc { animation:fadeUp 0.7s ease 0.8s forwards; }

  .drink-tags {
    display:flex; gap:10px; flex-wrap:wrap;
    margin-top:1.2em; opacity:0;
  }
  .slide.active .drink-tags { animation:fadeUp 0.7s ease 1s forwards; }
  .tag {
    padding:6px 16px;
    border:1px solid rgba(212,168,67,0.5);
    border-radius:20px; font-size:10px;
    letter-spacing:0.22em; color:var(--gold);
    text-transform:uppercase;
    background:rgba(0,0,0,0.3);
    backdrop-filter:blur(6px);
  }

  @keyframes fadeUp { to { opacity:1; transform:translateY(0); } }

  /* LOGO */
  .logo-top {
    position:fixed; top:5%; left:50%;
    transform:translateX(-50%);
    z-index:100; text-align:center;
    opacity:0; animation:fadeUp 1.2s ease 0.2s forwards;
  }
  .logo-top .brand {
    font-family:'Bebas Neue',cursive;
    font-size:clamp(18px,2.5vw,30px);
    letter-spacing:0.5em; color:#fff;
    text-shadow:0 2px 20px rgba(0,0,0,0.8);
  }
  .logo-divider { width:40px; height:1px; background:var(--gold); margin:7px auto; }
  .logo-top .sub {
    font-size:9px; letter-spacing:0.5em;
    color:var(--gold); text-transform:uppercase;
  }

  /* PROGRESO */
  .progress-bar {
    position:fixed; bottom:0; left:0;
    width:0%; height:4px;
    background:linear-gradient(90deg, var(--gold), rgba(255,255,255,0.5));
    z-index:200;
  }

  /* DOTS */
  .dots {
    position:fixed; bottom:22px; left:50%;
    transform:translateX(-50%);
    display:flex; gap:12px; z-index:200;
  }
  .dot {
    width:7px; height:7px; border-radius:50%;
    background:rgba(255,255,255,0.25);
    cursor:pointer; border:none; transition:all 0.3s;
  }
  .dot.active { background:var(--gold); transform:scale(1.7); }

  .slide-counter {
    position:fixed; right:5%; bottom:18px;
    font-family:'Bebas Neue',cursive;
    font-size:14px; letter-spacing:0.3em;
    color:rgba(255,255,255,0.3); z-index:200;
  }
  .slide-counter span { color:var(--gold); }

  /* INTRO */
  #intro {
    position:fixed; inset:0; background:#000;
    z-index:1000; display:flex; align-items:center;
    justify-content:center; flex-direction:column; gap:20px;
    animation:introOut 0.8s ease 2.6s forwards;
  }
  @keyframes introOut { to { opacity:0; pointer-events:none; } }
  .intro-logo {
    font-family:'Bebas Neue',cursive;
    font-size:clamp(70px,15vw,160px);
    color:#fff; letter-spacing:0.2em;
    animation:introLogoIn 1s ease 0.3s both;
  }
  @keyframes introLogoIn {
    from { opacity:0; transform:scale(0.6); letter-spacing:1em; }
    to   { opacity:1; transform:scale(1);   letter-spacing:0.2em; }
  }
  .intro-line { width:0; height:1px; background:var(--gold); animation:lineGrow 0.8s ease 1.1s forwards; }
  @keyframes lineGrow { to { width:80px; } }
  .intro-sub {
    font-size:11px; letter-spacing:0.6em;
    color:var(--gold); text-transform:uppercase;
    opacity:0; animation:fadeUp 0.8s ease 1.3s forwards;
  }
</style>
</head>
<body>

<div id="intro">
  <div class="intro-logo">LI</div>
  <div class="intro-line"></div>
  <div class="intro-sub">La Industria &middot; Fast Food</div>
</div>

<div class="logo-top">
  <div class="brand">La Industria</div>
  <div class="logo-divider"></div>
  <div class="sub">Fast Food &middot; Est. 2022</div>
</div>

<div class="progress-bar" id="progressBar"></div>
<div class="dots" id="dotsContainer"></div>
<div class="slide-counter"><span id="currentNum">1</span> / <span id="totalNum">6</span></div>

<div id="stage"></div>

  const bg = document.createElement('div');
  bg.className = 'bg';
  bg.style.backgroundImage = `url(${d.bg})`;

  const grad = document.createElement('div');
  grad.className = 'grad';

  const particles = document.createElement('div');
  particles.className = 'particles';
  for (let p = 0; p < 10; p++) {
    const pt = document.createElement('div');
    pt.className = 'particle';
    const sz = Math.random()*6+3;
    pt.style.cssText = `width:${sz}px;height:${sz}px;background:${d.color};left:${Math.random()*100}%;animation-duration:${7+Math.random()*8}s;animation-delay:${Math.random()*7}s;`;
    particles.appendChild(pt);
  }

  const copy = document.createElement('div');
  copy.className = 'copy';

  const lbl = document.createElement('div');
  lbl.className = 'slide-label';
  lbl.textContent = d.label ? `${d.label} — La Industria Fast Food` : 'La Industria Fast Food';

  const nm = document.createElement('div');
  nm.className = 'drink-name';
  nm.innerHTML = d.name.join('<br>');

  const desc = document.createElement('div');
  desc.className = 'drink-desc';
  desc.textContent = d.desc;

  const tags = document.createElement('div');
  tags.className = 'drink-tags';
  d.tags.forEach(t => {
    const tg = document.createElement('span');
    tg.className = 'tag';
    tg.textContent = t;
    tags.appendChild(tg);
  });

  copy.append(lbl, nm, desc, tags);
  slide.append(bg, grad, particles, copy);
  stage.appendChild(slide);

  const dot = document.createElement('button');
  dot.className = 'dot' + (i===0?' active':'');
  dot.addEventListener('click', () => goTo(i));
  dotsEl.appendChild(dot);
});

function goTo(idx) {
  clearTimeout(timer);
  cancelAnimationFrame(rafId);
  const slides = document.querySelectorAll('.slide');
  const dots   = document.querySelectorAll('.dot');
  slides[current].classList.remove('active');
  dots[current].classList.remove('active');
  current = ((idx % drinks.length) + drinks.length) % drinks.length;
  slides[current].classList.add('active');
  dots[current].classList.add('active');
  document.getElementById('currentNum').textContent = current + 1;
  startProgress();
  timer = setTimeout(() => goTo(current + 1), DURATION);
}

const bar = document.getElementById('progressBar');
function startProgress() {
  progStart = performance.now();
  bar.style.width = '0%';
  rafId = requestAnimationFrame(tickProgress);
}
function tickProgress(now) {
  const pct = Math.min((now - progStart) / DURATION * 100, 100);
  bar.style.width = pct + '%';
  if (pct < 100) rafId = requestAnimationFrame(tickProgress);
}

setTimeout(() => {
  document.querySelectorAll('.slide')[0].classList.add('active');
  startProgress();
  timer = setTimeout(() => goTo(1), DURATION);
}, 2900);

document.addEventListener('keydown', e => {
  if (e.key==='ArrowRight' || e.key===' ') goTo(current+1);
  if (e.key==='ArrowLeft') goTo(current-1);
});
let tx = 0;
document.addEventListener('touchstart', e => tx = e.touches[0].clientX);
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 50) goTo(dx < 0 ? current+1 : current-1);
});
</script>
</body>
</html>
